; PlatformIO 配置文件
; ESP32-D0WDQ6（V3 版本） + 2.13寸黑白红三色墨水屏 (250x122 横屏 / GDEY0213Z98 / SSD1680Z)
;
; 工作流：连 WiFi → POST /ticket（加密 IMAP 参数）→ 收 base64 黑/红双图层 1bit 位图 → 刷屏 → deep sleep
; 全部中文字体/位图渲染都在服务端完成，固件端零字体依赖
;
; 配网：上电时启动 15 秒 BLE 等待窗口（连接后 5 分钟会话超时）→ 浏览器用 Web Bluetooth 写入 NVS

[platformio]
default_envs = esp32dev
; RISC-V 工具链 ld.exe 对非 ASCII 路径处理有 bug（中文路径下无法写 map 文件），
; 把 build_dir 指到纯英文路径绕过；esp32dev 用的 Xtensa 工具链原本不受影响，
; 但为统一管理，两个 env 都改用此路径（仅构建产物位置变化，下次首编会全量重编一次）
build_dir = C:/pio_build

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串口监视器
monitor_speed = 115200
monitor_filters = time

; 上传提速
upload_speed = 921600

; 编译优化，适配联网+墨水屏绘图 + NimBLE 配网
build_flags =
  -D ARDUINO_ESP32_DEV
  -D CORE_DEBUG_LEVEL=2
  ; 关闭 NimBLE 内部冗余日志，节省 ~10KB RAM
  -D CONFIG_BLE_HS_LOG_LEVEL=1
  -D CONFIG_NIMBLE_LOG_LEVEL=0
  -D RWB_SCREEN

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    bblanchon/ArduinoJson@^7.0.4
    h2zero/NimBLE-Arduino@^1.4.1

; ============================================================
; ESP32-S3-DevKitC-1（Xtensa LX7 双核 / 8MB Flash）
;   - 复用 esp32dev 默认墨水屏引脚（SCK=18/MOSI=23/CS=5/DC=17/RST=16/BUSY=4），
;     这些引脚在 S3 上均可用，无需 config.h 单独条件编译
;   - BOOT 按键同 GPIO0；走外置 USB-UART（不启用 USB-CDC）
;   - 构建命令：pio run -e esp32s3
; ============================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口监视器
monitor_speed = 115200
monitor_filters = time

; 上传提速
upload_speed = 921600

; 编译优化，适配联网+墨水屏绘图 + NimBLE 配网
build_flags =
  -D CORE_DEBUG_LEVEL=2
  ; 关闭 NimBLE 内部冗余日志，节省 ~10KB RAM
  -D CONFIG_BLE_HS_LOG_LEVEL=1
  -D CONFIG_NIMBLE_LOG_LEVEL=0
  -D IS_ESP32S3

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    bblanchon/ArduinoJson@^7.0.4
    h2zero/NimBLE-Arduino@^1.4.1

; ============================================================
; ESP32-C3 SuperMini（ESP32-C3 FN4 / RISC-V 单核 / 4MB Flash）
;   - 板载 USB-C 直连芯片 USB-Serial-JTAG，无需外置 UART
;   - 注意：C3 GPIO 数量少，源码中 EPD_MOSI=23 / EPD_DC=17 / EPD_RST=16
;     在 C3 上不可用，需在 config.h 用条件编译改用 C3 可用引脚
;   - 构建命令：pio run -e esp32c3supermini
; ============================================================
[env:seeed_xiao_esp32s3]
; 乐鑫 ESP32 官方开发平台
platform = espressif32
; 官方适配板型，与XIAO ESP32-S3硬件参数完全匹配
board = seeed_xiao_esp32s3
; 开发框架
framework = arduino

; 上传速度：高速921600，上传不稳可降到115200
upload_speed = 115200
; 串口监视器波特率
monitor_speed = 115200
monitor_filters = time

; Flash工作模式：QIO性能最优，兼容性差可改为 dout
; board_build.flash_mode = dout
; CPU主频，默认240MHz，省电可降为160000000L
; board_build.f_cpu = 240000000L

; 必需：开启原生USB虚拟串口（板子无外置串口芯片）
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D IS_XIAO_ESP32S3
    -D SCREEN_212

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    bblanchon/ArduinoJson@^7.0.4
    h2zero/NimBLE-Arduino@^1.4.1


[env:seeed_xiao_esp32s3_3C]
; 乐鑫 ESP32 官方开发平台
platform = espressif32
; 官方适配板型，与XIAO ESP32-S3硬件参数完全匹配
board = seeed_xiao_esp32s3
; 开发框架
framework = arduino

; 上传速度：高速921600，上传不稳可降到115200
upload_speed = 115200
; 串口监视器波特率
monitor_speed = 115200
; monitor_filters = time

; Flash工作模式：QIO性能最优，兼容性差可改为 dout
; board_build.flash_mode = dout
; CPU主频，默认240MHz，省电可降为160000000L
; board_build.f_cpu = 240000000L

; 必需：开启原生USB虚拟串口（板子无外置串口芯片）
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D IS_XIAO_ESP32S3
    -D RWB_SCREEN

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    bblanchon/ArduinoJson@^7.0.4
    h2zero/NimBLE-Arduino@^1.4.1
